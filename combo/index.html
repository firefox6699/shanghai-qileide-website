<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>连击计数器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>连击计数器</h1>
      <p class="subtitle">连续点击，冲击最高连击</p>
    </header>

    <section class="stats" aria-live="polite">
      <div class="stat">
        <span class="stat-label">当前分数</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">连击</span>
        <span class="stat-value combo" id="combo">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">最高连击</span>
        <span class="stat-value" id="best">0</span>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="tapBtn">+1 点击</button>
      <button type="button" class="btn btn-ghost" id="resetBtn">重置</button>
    </div>

    <p class="hint" id="hint">开始点击吧！</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
